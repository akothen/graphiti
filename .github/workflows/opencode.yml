name: OpenCode Agent (DeepSeek V4 Pro)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode-deepseek-agent:
    # Only run if a comment starts with /opencode or /OC
    if: startsWith(github.event.comment.body, '/opencode') || startsWith(github.event.comment.body, '/OC')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenCode and Plugins
        run: |
          npm install -g @opencode-ai/cli
          bunx oh-my-opencode install --headless

      - name: Run OpenCode Agent Task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_PROVIDER: "deepseek"
          OPENCODE_MODEL: "deepseek-v4-pro"
          DEEPSEEK_REASONING_EFFORT: "max"  # Maximize reasoning capabilities for complex coding tasks
        run: |
          opencode github run \
            --issue-number "${{ github.event.issue.number || github.event.pull_request.number }}" \
            --comment-body "${{ github.event.comment.body }}"
